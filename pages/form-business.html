<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дополнительные материалы | ChampionLED</title><link rel="stylesheet" href="../design-system/tokens.css"><link rel="stylesheet" href="../design-system/components.css?v=a6c2b8377f6e"><link rel="stylesheet" href="../design-system/pages.css?v=1b7addbd69e6"></head><body class="ch" id="page-top"><main class="ch-site-main" id="top"><section class="ch-page-hero ch-page-hero--catalog" aria-label="Дополнительные материалы" id="request">
      <div class="ch-page-hero-catalog-grid">

          <h1 class="ch-title" data-origin="form-business-0003">Дополнительные материалы</h1>
          <p class="ch-lead">Оставьте контакты, чтобы посмотреть каталоги и инструкции. Если нужны дополнительные сведения об изделии, напишите свой вопрос.</p>
          
        </div>
      </div></section><div class="ch-page ch-container ch-page--after-hero"><section class="ch-page-section"><div class="ch-form-shell"><form class="ch-form" method="dialog" data-origin="form-business-0005"><p class="ch-caption ch-muted" data-origin="form-business-0006">* Обязательные поля</p><div class="ch-fields" data-origin="form-business-0007"><div class="ch-field" data-origin="form-business-0008"><label for="business-materials-name"><span class="ch-caption" data-origin="form-business-0009">Ваше имя *</span></label><input id="business-materials-name" name="name" autocomplete="name" placeholder="Как к вам обращаться" required="" data-origin="form-business-0011"></div><div class="ch-field" data-origin="form-business-0012"><label for="business-materials-phone"><span class="ch-caption" data-origin="form-business-0013">Телефон *</span></label><input id="business-materials-phone" name="phone" type="tel" autocomplete="tel" minlength="7" maxlength="25" placeholder="+7 (___) ___-__-__" required="" data-origin="form-business-0015"></div></div><div class="ch-fields" data-origin="form-business-0016"><div class="ch-field" data-origin="form-business-0017"><label for="business-materials-email"><span class="ch-caption" data-origin="form-business-0018">E-mail *</span></label><input id="business-materials-email" name="email" type="email" autocomplete="email" placeholder="name@example.ru" required="" data-origin="form-business-0020"></div><div class="ch-field" data-origin="form-business-0021"><label for="business-materials-city"><span class="ch-caption" data-origin="form-business-0022">Город</span></label><input id="business-materials-city" name="city" autocomplete="address-level2" placeholder="Ваш город" data-origin="form-business-0023"></div></div><div class="ch-field" data-origin="form-business-0024"><label for="business-materials-company"><span class="ch-caption" data-origin="form-business-0025">Компания</span></label><input id="business-materials-company" name="company" autocomplete="organization" placeholder="Название компании" data-origin="form-business-0026"></div><div class="ch-field" data-origin="form-business-0027"><label for="business-materials-message"><span class="ch-caption" data-origin="form-business-0028">Вопрос или нужные материалы</span></label><textarea id="business-materials-message" name="message" placeholder="Если нужны дополнительные сведения, напишите, какие материалы или пояснения вы ищете." data-origin="form-business-0029"></textarea></div><p class="ch-caption ch-muted" data-origin="form-business-0030">Это форма для просмотра прототипа. Введённые данные никуда не отправляются и не сохраняются.</p><div class="ch-flow" data-origin="form-business-0031"><label class="ch-check" for="form-business-0032-field" data-origin="form-business-0032"><input type="checkbox" name="personal_data" required="" id="form-business-0032-field" data-origin="form-business-0033"><span><span class="ch-caption" data-origin="form-business-0034">Даю согласие на обработку персональных данных</span></span></label><label class="ch-check" for="form-business-0036-field" data-origin="form-business-0036"><input type="checkbox" name="marketing" id="form-business-0036-field" data-origin="form-business-0037"><span><span class="ch-caption" data-origin="form-business-0038">Даю согласие на получение рекламно-информационных сообщений</span></span></label></div><button class="ch-btn" type="button" data-origin="form-business-0039">Посмотреть материалы</button></form></div></section></div></main><script src="../assets/preview/page-bridge.js?v=b9fd082ebc0c" data-preview-bridge defer></script>
